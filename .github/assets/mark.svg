<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="yenigma">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0c0f"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <radialGradient id="aura" cx="256" cy="70" r="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8995a" stop-opacity=".22"/><stop offset=".55" stop-color="#b8995a" stop-opacity=".05"/><stop offset="1" stop-color="#b8995a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe2c6"/><stop offset="1" stop-color="#a8874f"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9c4a0" stop-opacity="0"/><stop offset=".5" stop-color="#d9c4a0" stop-opacity=".8"/><stop offset="1" stop-color="#d9c4a0" stop-opacity="0"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".022"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="card"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <style>
  .eyes { animation: look 9s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 9s infinite; }
  .caret { animation: caret 1.1s steps(1) infinite; }
  @keyframes look { 0%,30% { transform: translateX(0) } 36%,52% { transform: translateX(-10px) } 58%,74% { transform: translateX(10px) } 80%,100% { transform: translateX(0) } }
  @keyframes blink { 0%,20% { transform: scaleY(1) } 21% { transform: scaleY(.08) } 22.5%,64% { transform: scaleY(1) } 65% { transform: scaleY(.08) } 66.5% { transform: scaleY(1) } 67.5% { transform: scaleY(.08) } 69%,100% { transform: scaleY(1) } }
  @keyframes caret { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .eyes, .eye, .caret { animation: none } }
</style>
  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#aura)"/>
    <rect width="512" height="512" fill="url(#scan)"/>
    <path d="M91.0,0 H421.0 A30,30 0 0 0 391.0,30 V66 A66,66 0 0 1 325.0,132 H187.0 A66,66 0 0 1 121.0,66 V30 A30,30 0 0 0 91.0,0 Z" fill="#000"/>
    <path d="M91.0,0 A30,30 0 0 1 121.0,30 V66 A66,66 0 0 0 187.0,132 H325.0 A66,66 0 0 0 391.0,66 V30 A30,30 0 0 1 421.0,0" fill="none" stroke="url(#hair)" stroke-width="2"/>
    <g class="eyes"><g fill="#ece7de" opacity=".45" filter="url(#glow)"><rect class="eye" x="206.0" y="39.0" width="30" height="50" rx="15.0"/><rect class="eye" x="276.0" y="39.0" width="30" height="50" rx="15.0"/></g><g fill="#ece7de"><rect class="eye" x="206.0" y="39.0" width="30" height="50" rx="15.0"/><rect class="eye" x="276.0" y="39.0" width="30" height="50" rx="15.0"/></g></g>
    <rect class="caret" x="206" y="372" width="100" height="12" rx="2" fill="url(#gold)"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
</svg>
